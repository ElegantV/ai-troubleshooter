name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 build + 单测
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 + 编译
        run: npm run build
      - name: 单元测试（vitest，自动跳过需要本机全栈的 UI e2e）
        run: npx vitest run src/
      - name: 安全审计（依赖漏洞）
        run: npm audit --omit=dev --audit-level=high || true

  frontend:
    name: 前端 lint + typecheck + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查（vue-tsc）
        run: npm run typecheck
      - name: 单元/组件测试（vitest + @vue/test-utils）
        run: npm test
      - name: 构建产物
        run: npm run build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: public/
          retention-days: 7

  docker:
    name: Docker 镜像构建校验
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -t ats-backend:ci .
      - name: 构建 nginx 镜像
        run: docker build -f Dockerfile.nginx -t ats-nginx:ci .