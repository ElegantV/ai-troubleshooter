# 安全响应头（server 级与带 add_header 的 location 级都需要 include：
# nginx 规则是 location 内一旦出现 add_header，server 级的 add_header 全部失效）
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 产物无内联脚本，script-src 收紧到 'self'；Element Plus 运行时注入样式需 style-src 'unsafe-inline'；
# 验证码图为 data URI，img-src 需 data:
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
# 启用 TLS 后取消注释
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
