# AI 问题排查助手 — nginx 反向代理配置
# 用法: nginx -c /Users/a1-6/Documents/programs/ai-troubleshooter/repo/deploy/nginx.conf
# 入口: http://localhost:8080  （静态页面由 nginx 直接托管，/api 反代到 Node 后端 3000）
# 注意: root/pid/error_log 为绝对路径，机器/目录变更时需同步修改

worker_processes  1;
pid  /Users/a1-6/Documents/programs/ai-troubleshooter/repo/deploy/nginx.pid;
error_log  /Users/a1-6/Documents/programs/ai-troubleshooter/repo/deploy/nginx-error.log warn;

events {
    worker_connections  1024;
}

http {
    include  /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile  on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types  text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # 登录接口限流：每 IP 10r/m（每 6 秒放行 1 个），突发最多排队 5 个，防口令爆破
    limit_req_zone  $binary_remote_addr  zone=login_zone:1m  rate=10r/m;

    server {
        listen  8080;
        server_name  localhost;

        # 前端构建产物（repo/frontend npm run build 输出到 repo/public）
        root  /Users/a1-6/Documents/programs/ai-troubleshooter/repo/public;
        index  index.html;

        # 安全响应头（/api/ 与无 add_header 的 location 由此覆盖）
        include  /Users/a1-6/Documents/programs/ai-troubleshooter/repo/deploy/security-headers.conf;

        # 带 hash 的静态资源：内容不变可长缓存
        location /assets/ {
            expires  30d;
            add_header  Cache-Control  "public, immutable";
            include  /Users/a1-6/Documents/programs/ai-troubleshooter/repo/deploy/security-headers.conf;
        }

        # 后端 API：LLM 分析最长 30s，放宽代理超时到 120s
        location /api/ {
            proxy_pass  http://127.0.0.1:3000;
            proxy_http_version  1.1;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_connect_timeout  10s;
            proxy_read_timeout     120s;
            proxy_send_timeout     120s;
        }

        # 登录/注册：独立限流，超出直接 429
        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req  zone=login_zone  burst=5  nodelay;
            limit_req_status 429;
            proxy_pass  http://127.0.0.1:3000;
            proxy_http_version  1.1;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_connect_timeout  10s;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
        }

        # SPA 单页应用：其余路径回退到 index.html
        location / {
            try_files  $uri $uri/ /index.html;
            add_header  Cache-Control  "no-cache";
            include  /Users/a1-6/Documents/programs/ai-troubleshooter/repo/deploy/security-headers.conf;
        }
    }
}
