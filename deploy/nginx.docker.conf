# AI 问题排查助手 — nginx 容器化配置（docker compose 用）
# 入口: http://localhost:8080 （静态页面由 nginx 托管，/api 反代到 backend 容器 3000）
# 与 deploy/nginx.conf（宿主机直跑版）差异：路径全部容器相对、无宿主 pid/error_log 绝对路径

worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid  /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include  /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile  on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types  text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # 登录接口限流：每 IP 10r/m（每 6 秒放行 1 个），突发最多排队 5 个，防口令爆破
    limit_req_zone  $binary_remote_addr  zone=login_zone:1m  rate=10r/m;

    server {
        listen  8080;
        server_name  localhost;

        # 前端构建产物（Dockerfile.nginx 从 repo/public 拷入）
        root  /usr/share/nginx/html;
        index  index.html;

        # 安全响应头（/api/ 与无 add_header 的 location 由此覆盖）
        include  /etc/nginx/conf.d/security-headers.conf;

        # 带 hash 的静态资源：内容不变可长缓存
        location /assets/ {
            expires  30d;
            add_header  Cache-Control  "public, immutable";
            include  /etc/nginx/conf.d/security-headers.conf;
        }

        # 后端 API：LLM 分析最长 30s，放宽代理超时到 120s
        location /api/ {
            proxy_pass  http://backend:3000;
            proxy_http_version  1.1;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_connect_timeout  10s;
            proxy_read_timeout     120s;
            proxy_send_timeout     120s;
        }

        # 登录/注册：独立限流，超出直接 429
        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req  zone=login_zone  burst=5  nodelay;
            limit_req_status 429;
            proxy_pass  http://backend:3000;
            proxy_http_version  1.1;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_connect_timeout  10s;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
        }

        # SPA 单页应用：其余路径回退到 index.html
        location / {
            try_files  $uri $uri/ /index.html;
            add_header  Cache-Control  "no-cache";
            include  /etc/nginx/conf.d/security-headers.conf;
        }
    }
}